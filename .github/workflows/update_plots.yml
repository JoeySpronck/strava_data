name: Update plots from Strava

on:
  workflow_dispatch:  # allows manual trigger and webhook trigger (if configured)
    inputs:
      refresh_ids:
        # Set by the webhook worker: the activities edited since the last run, so their
        # cached description / private note / streams are refetched. Empty = none.
        description: 'Comma-separated Strava activity ids to refetch despite the cache'
        required: false
        default: ''
  push:
    branches:
      - main  # regenerate plots after every push to main
  schedule:
    - cron: '5 0 * * *'  # runs every day at 00:05 UTC (after midnight in europe)

# One run at a time: overlapping runs would each restore the same cache and race to save it.
concurrency:
  group: update-plots
  cancel-in-progress: false

jobs:
  update-plots:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Up to 4 rate-limit waits of ~15 min each (STRAVA_RATE_LIMIT_WAITS) plus the run itself.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main  # base branch where your script currently lives
          token: ${{ secrets.GITHUB_TOKEN }}  # allows push
          persist-credentials: true  # This is key for pushing back

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e .

      # .cache/ holds per-activity descriptions and streams (see strava_data/activity_cache.py).
      # Without it every run would refetch every activity and hit Strava's rate limit.
      # Cache entries are immutable, so each run saves under a new key and restores the newest.
      - name: Restore Strava API cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: strava-cache-${{ github.run_id }}
          restore-keys: strava-cache-

      - name: Run update script
        env:
          REFRESH_IDS: ${{ inputs.refresh_ids }}
          # On Strava's 15-min rate limit, wait for the next window and continue instead of
          # stopping early, at most this many times (strava_data/activity_cache.py).
          STRAVA_RATE_LIMIT_WAITS: 4
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_CLIENT_REFRESH_TOKEN: ${{ secrets.STRAVA_CLIENT_REFRESH_TOKEN }}
        run: |
          python update_plots.py

      - name: Save Strava API cache
        # Keep what was fetched even if plotting failed, so the next run resumes from it.
        if: always() && hashFiles('.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: strava-cache-${{ github.run_id }}

      - name: Add cache-busting token to plot filenames
        # Append a per-run token to every plot filename + patch the markdown refs so the
        # GitHub app stops serving stale images. Runs only here on the publish path — main
        # keeps clean, hand-editable filenames. See .github/helper_scripts/add_cache_token_to_image_names.py.
        run: |
          python .github/helper_scripts/add_cache_token_to_image_names.py "$(date -u +%Y%m%d%H%M%S)"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B plot_updates
          # On plot_updates the plots dashboard becomes the README so GitHub renders it
          # for this branch. main keeps its own short, repo-focused README.md.
          mv -f PLOTS.md README.md
          git add .
          COMMIT_DATE=$(date -u +"%Y-%m-%d")
          git commit -m "Update plots from Strava - ${COMMIT_DATE}" || echo "No changes to commit"
          git push origin plot_updates --force
